// Root build: shared configuration for every platform module.
//
// The whole point of this project layout is that `core` holds all the real
// logic and compiles to Java 8 bytecode, so a single artifact loads on any
// server JVM from Java 8 (MC 1.8) through the current release.
subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { name = 'papermc';     url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { name = 'spigotmc';    url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { name = 'sonatype';    url = 'https://oss.sonatype.org/content/groups/public/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Targeting 8 is obsolete-but-supported on modern JDKs; silence the noise.
        options.compilerArgs << '-Xlint:-options'
    }
}
